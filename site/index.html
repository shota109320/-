<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みうらや 誠麺 -counter bg-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500&family=Dela+Gothic+One&family=Yuji+Syuku&family=Yuji+Boku&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --wood-dark:#3b2415;
  --wood-mid:#6b4226;
  --counter:#a9702f;
  --counter-dark:#8a5820;
  --tag-cream:#efe3c4;
  --tag-shadow:#c9b98c;
  --seal-red:#a63a2e;
  --ink:#2b2018;
  --washi:#f7f1e2;
  --wall:#fbf7ee;
}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#1c1109;
    font-family:"Noto Sans JP", sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding-bottom:60px;
    font-size:18px;
    font-weight:700;
  }
  .page{
    max-width:900px;
    margin:0 auto;
    box-shadow:0 0 50px rgba(0,0,0,0.6);
  }

  header{
    padding:20px 20px 30px;
    display:flex;
    justify-content:center;
  }
  .board{
    position:relative;
    width:100%;
    max-width:820px;
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px 30px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='120'><rect width='300' height='120' fill='%233a2c22'/><path d='M0 15 Q60 5 120 18 Q180 8 240 20 Q270 14 300 22' stroke='%232a1f18' stroke-width='4' fill='none' opacity='0.6'/><path d='M0 35 Q70 25 140 38 Q200 28 260 40 Q280 34 300 42' stroke='%234a382c' stroke-width='4' fill='none' opacity='0.6'/><path d='M0 55 Q60 48 130 58 Q190 50 250 60 Q275 55 300 62' stroke='%232a1f18' stroke-width='4' fill='none' opacity='0.6'/><path d='M0 75 Q65 68 135 78 Q195 70 255 80 Q278 75 300 82' stroke='%234a382c' stroke-width='4' fill='none' opacity='0.6'/><path d='M0 95 Q60 88 125 98 Q185 90 245 100 Q272 95 300 102' stroke='%232a1f18' stroke-width='4' fill='none' opacity='0.6'/></svg>");
    background-size:cover;
    border:3px solid #9a9080;
    border-radius:3px;
    box-shadow:0 6px 14px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,0,0,0.4);
  }
  .board::before{
    content:"";
    position:absolute;
    top:5px;left:5px;right:5px;bottom:5px;
    border:1px solid rgba(180,170,150,0.35);
    pointer-events:none;
  }
.board .emblem{
  flex-shrink:0;
  width:62px;
  height:62px;
  border-radius:50%;
  overflow:hidden;
  background:#f2e6c8;
  border:3px solid #e8e0c8;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.5);
}

.board .emblem img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  display:block;
}
  .board h1{
    font-family:"Yuji Boku", "Shippori Mincho", serif;
    font-weight:700;
    font-size:46px;
    letter-spacing:0.06em;
    margin:0;
    color:#fff6df;
    text-shadow:
      1px 1px 0 #1a120c,
      -1px 1px 1px rgba(0,0,0,0.5),
      0 2px 3px rgba(0,0,0,0.6),
      0 0 10px rgba(255,240,200,0.2);
  }
  .board h1 .name-kana{
    margin-right:0.05em;
  }
  .board .legs{
    position:absolute;
    bottom:-14px;left:0;right:0;
    display:flex;
    justify-content:space-around;
    padding:0 30px;
  }
  .board .legs svg{ display:block; }

  /* ---- wall + hanging tags ---- */
  .wall{
    position:relative;
    min-height:620px;
    background-image:
      linear-gradient(180deg, rgba(20,12,6,0.5) 0%, rgba(20,12,6,0.2) 40%, rgba(20,12,6,0.08) 70%),
      url("static/images/store.jpg");
    background-size:cover;
    background-position:center 40%;
    padding:26px 24px 8px;
  }
  .beam{
    height:10px;
    background:linear-gradient(var(--wood-mid), var(--wood-dark));
    box-shadow:0 3px 4px rgba(0,0,0,0.35);
    margin-bottom:0;
  }

  .signboard{
    display:flex;
    justify-content:flex-start;
    gap:22px;
    padding:30px 24px 36px;
    flex-wrap:nowrap;
    overflow-x:auto;
    max-width:680px;
    margin:0;
  }

  @media (min-width:700px){
    .signboard{
      max-width:100%;
      justify-content:flex-start;
      padding:52px 32px 54px;
      gap:28px;
    }
    .tag{ width:170px; padding:42px 14px 30px; }
    .tag-text{ font-size:28px; }
    .tag .hole{ width:14px; height:14px; margin-bottom:18px; }
    .wall{ min-height:680px; }
  }

  .tag{
    position:relative;
    display:block;
    width:110px;
    background:linear-gradient(var(--tag-cream), #e0cd9a);
    border:1px solid var(--tag-shadow);
    border-radius:1px;
    padding:28px 12px 20px;
    box-shadow:2px 6px 10px rgba(0,0,0,0.4), inset 0 0 18px rgba(120,90,40,0.18);
    cursor:pointer;
    transform-origin:top center;
    transition:transform 0.25s ease, box-shadow 0.25s ease;
    animation:sway 4.5s ease-in-out infinite;
    animation-delay:calc(var(--i) * -0.6s);
    overflow:hidden;
  }
  .tag,
  .tag:link,
  .tag:visited{
    color:inherit;
    text-decoration:none;
  }
  .tag:focus{ outline:none; }
  .tag:focus-visible{
    outline:2px solid var(--seal-red);
    outline-offset:3px;
  }
  .tag::before{
    content:"";position:absolute;top:-16px;left:50%;transform:translateX(-50%);
    width:2px;height:18px;background:var(--wood-dark);
    box-shadow:0 2px 3px rgba(0,0,0,0.5);
  }
  .tag::after{
    content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);
    width:6px;height:6px;border-radius:50%;background:var(--seal-red);
    box-shadow:0 1px 2px rgba(0,0,0,0.5);
  }
  .tag .grain{
    position:absolute;inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity:0.18;
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  .tag .stain{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, rgba(120,80,30,0.35), transparent 70%);
    pointer-events:none;
  }
  .tag:hover{ transform:rotate(-2deg) translateY(-4px); box-shadow:3px 10px 16px rgba(0,0,0,0.45); }
  @keyframes sway{ 0%,100%{transform:rotate(-1.2deg);} 50%{transform:rotate(1.2deg);} }
  .tag:hover{ animation-play-state:paused; }
  @keyframes wiggle{
    0%{ transform:rotate(0deg); }
    20%{ transform:rotate(-8deg); }
    40%{ transform:rotate(6deg); }
    60%{ transform:rotate(-4deg); }
    80%{ transform:rotate(2deg); }
    100%{ transform:rotate(0deg); }
  }
  .tag.wiggle{ animation:wiggle 0.45s ease; }
  .tag-text{
    position:relative;
    z-index:1;
    font-family:"Yuji Boku", "Shippori Mincho", serif;
    font-size:28px;font-weight:700;
    writing-mode:vertical-rl;text-orientation:upright;letter-spacing:0.08em;
    color:#2c1c11;display:block;margin:0 auto;
    text-shadow:0 1px 0 rgba(255,255,255,0.35);
  }

  /* ---- wood tag variant (light plank, vertical grain, punched hole) ---- */
  .tag.wood{
    padding-top:18px;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='220'><rect width='90' height='220' fill='%23eaa955'/><path d='M8 0 Q13 45 7 90 Q3 130 11 175 Q15 200 9 220' stroke='%23c9822f' stroke-width='2.5' fill='none' opacity='0.55'/><path d='M20 0 Q24 50 18 95 Q15 140 22 180 Q26 205 20 220' stroke='%23d8933a' stroke-width='2' fill='none' opacity='0.45'/><path d='M32 0 Q37 40 30 85 Q27 130 34 170 Q38 200 32 220' stroke='%23b8722a' stroke-width='2.5' fill='none' opacity='0.5'/><path d='M44 0 Q49 55 42 100 Q39 145 46 185 Q50 205 44 220' stroke='%23d8933a' stroke-width='2' fill='none' opacity='0.4'/><path d='M56 0 Q61 45 54 90 Q51 135 58 175 Q62 200 56 220' stroke='%23c9822f' stroke-width='2.5' fill='none' opacity='0.5'/><path d='M68 0 Q73 50 66 95 Q63 140 70 180 Q74 205 68 220' stroke='%23b8722a' stroke-width='2' fill='none' opacity='0.45'/><path d='M80 0 Q85 40 78 85 Q75 130 82 170 Q86 200 80 220' stroke='%23d8933a' stroke-width='2.5' fill='none' opacity='0.4'/><ellipse cx='36' cy='120' rx='4' ry='7' fill='%23a8641f' opacity='0.5'/></svg>");
    background-size:100% 100%;
    border:1px solid #b8722a;
    border-radius:5px;
    box-shadow:2px 6px 10px rgba(0,0,0,0.5);
  }
  .tag.wood::before{ display:none; }
  .tag.wood::after{ display:none; }
  .tag.wood .hole{
    width:12px;height:12px;border-radius:50%;
    margin:0 auto 12px;
    background:radial-gradient(circle at 35% 35%, #4a2f10, #1c1006 70%);
    box-shadow:0 1px 2px rgba(255,255,255,0.3) inset, 0 2px 3px rgba(0,0,0,0.5);
  }
  .tag.wood .grain{ display:none; }
  .tag.wood .stain{ display:none; }
  .tag.wood .tag-text{
    color:#4a2f10;
    text-shadow:0 1px 0 rgba(255,255,255,0.25);
  }

  @media (max-width:768px){
    .signboard{
      gap:12px;
      overflow-x:auto;
      flex-wrap:nowrap;
    }

    .tag.wood{
      flex:0 0 74px;
      width:74px;
      min-width:74px;
      padding-left:8px;
      padding-right:8px;
      overflow:visible;
    }

    .tag.wood .tag-text{
      writing-mode:vertical-rl;
      text-orientation:upright;
      font-size:18px;
      line-height:1.15;
      width:1.3em;
      max-width:100%;
      margin-left:auto;
      margin-right:auto;
      white-space:nowrap;
      overflow:visible;
    }
  }

  .notice-board{
    width:min(82%, 760px);
    margin:0 auto 28px;
    background:rgba(247, 241, 226, 0.96);
    border:3px solid #a86d36;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 18px rgba(0,0,0,0.2), inset 0 0 16px rgba(125,85,40,0.12);
  }
  .notice-header{
    background:linear-gradient(#b5583d, #8d3929);
    color:#fff7ed;
    padding:12px 18px;
    font-family:"Yuji Boku", "Shippori Mincho", serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:0.08em;
    text-align:center;
  }
  .notice-slider{
    position:relative;
    min-height:165px;
    padding:0;
    background:linear-gradient(#f7f1e2, #efe1bf);
  }
  .notice-slide{
    display:none;
    padding:22px 24px 16px;
    min-height:165px;
  }
  .notice-slide.is-active{
    display:block;
    animation:fadeIn 0.4s ease;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);} 
    to{opacity:1; transform:translateY(0);} 
  }
  .notice-badge{
    display:inline-block;
    background:#bf5e3e;
    color:#fff;
    border-radius:999px;
    padding:6px 12px;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.08em;
    margin-bottom:10px;
  }
  .notice-title{
    margin:0 0 8px;
    font-family:"Yuji Boku", "Shippori Mincho", serif;
    font-size:30px;
    line-height:1.3;
    color:#342216;
  }
  .notice-text{
    margin:0;
    font-size:18px;
    line-height:1.7;
    color:#433127;
    font-weight:700;
  }
  .notice-meta{
    margin-top:12px;
    font-size:14px;
    font-weight:700;
    color:#734b34;
  }
  .notice-dots{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:0 0 18px;
    background:linear-gradient(#f7f1e2, #efe1bf);
  }
  .notice-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:#cbb38d;
    transition:all 0.2s ease;
  }
  .notice-dot.is-active{
    background:#8a4236;
    transform:scale(1.15);
  }

  /* ---- illustrated counter along the bottom of the wall ---- */
  .counter-illust{
    display:flex;
    align-items:flex-end;
    gap:18px;
    padding:0 26px;
    height:70px;
  }
  .counter-illust svg{ display:block; }

  .counter-bar{
    height:30px;
    background:linear-gradient(var(--counter), var(--counter-dark));
    border-top:3px solid #c98a3f;
    box-shadow:0 6px 14px rgba(0,0,0,0.4);
  }

</style>
<link rel="stylesheet" href="static/text-size.css">
</head>
<body>
<button class="text-size-toggle" type="button" aria-pressed="false">文字を大きく</button>

<div class="page">
<header>
  <div class="board">
    <div class="emblem">
  <img src="static/images/menu/S__50724889.jpg" alt="みうらや誠麺 ロゴ">
</div>
    <h1><span class="name-kana">みうらや</span><span class="name-kanji">誠麺</span></h1>
    <div class="legs">
      <svg width="20" height="16" viewBox="0 0 20 16"><path d="M2 0 L18 0 L10 16 Z" fill="#6b4226"/></svg>
      <svg width="20" height="16" viewBox="0 0 20 16"><path d="M2 0 L18 0 L10 16 Z" fill="#6b4226"/></svg>
      <svg width="20" height="16" viewBox="0 0 20 16"><path d="M2 0 L18 0 L10 16 Z" fill="#6b4226"/></svg>
    </div>
  </div>
</header>

<div class="wall">
  <div class="beam"></div>
  <nav class="signboard" id="signboard">
    <a class="tag wood" href="detail.html" style="--i:1">
      <div class="hole"></div>
      <span class="tag-text">メニュー</span>
    </a>
    <a class="tag wood" href="shop.html" style="--i:2">
      <div class="hole"></div>
      <span class="tag-text">お店の情報</span>
    </a>
    <a class="tag wood" href="kodawari.html" style="--i:0">
      <div class="hole"></div>
      <span class="tag-text">こだわり</span>
    </a>
    <a class="tag wood" href="coupon.html" style="--i:0">
      <div class="hole"></div>
      <span class="tag-text">クーポン</span>
    </a>
    <a class="tag wood" href="rank.html" style="--i:2">
      <div class="hole"></div>
<span class="tag-text">会員ランク</span>
</a>
<a class="tag wood" href="access.html" style="--i:1">
      <div class="hole"></div>
      <span class="tag-text">アクセス</span>
    </a>
  </nav>

  <section class="notice-board" aria-label="お知らせ">
    <div class="notice-header">お知らせ</div>
    <div class="notice-slider" id="notice-slider" aria-live="polite"></div>
    <div class="notice-dots" id="notice-dots" aria-label="お知らせの切り替え"></div>
  </section>

</div>
</div>

<script>
  const tags = document.querySelectorAll('.tag');

  function playWiggle(tag){
    tag.classList.remove('wiggle');
    void tag.offsetWidth;
    tag.classList.add('wiggle');
  }

  tags.forEach(tag => {
    tag.addEventListener('mouseenter', () => playWiggle(tag));
    tag.addEventListener('animationend', (e) => {
      if(e.animationName === 'wiggle') tag.classList.remove('wiggle');
    });
  });

  const noticeItems = [
    {
      badge: '期間限定',
      title: '冷し中華 3日間限定',
      text: 'さっぱりとした味わいで、暑い日にも食べやすい人気メニューです。旬の野菜をたっぷり使っています。',
      meta: '7月20日〜7月22日'
    },
    {
      badge: '休業案内',
      title: '8月15日 休業',
      text: '設備点検のため、8月15日は休業させていただきます。ご迷惑をおかけしますが、何卒よろしくお願いいたします。',
      meta: 'ご連絡: お電話でご確認ください'
    },
    {
      badge: 'おすすめ',
      title: 'ランチ限定セット',
      text: '限定セットは、主菜と小鉢がついてお得です。ご来店の際は店頭でご確認ください。',
      meta: '毎日 11:30〜14:00'
    }
  ];

  const noticeSlider = document.getElementById('notice-slider');
  const noticeDots = document.getElementById('notice-dots');
  let noticeIndex = 0;

  function renderNoticeSlides() {
    noticeSlider.innerHTML = noticeItems.map((item, index) => `
      <article class="notice-slide ${index === noticeIndex ? 'is-active' : ''}">
        <div class="notice-badge">${item.badge}</div>
        <h2 class="notice-title">${item.title}</h2>
        <p class="notice-text">${item.text}</p>
        <div class="notice-meta">${item.meta}</div>
      </article>
    `).join('');

    noticeDots.innerHTML = noticeItems.map((_, index) => `
      <button class="notice-dot ${index === noticeIndex ? 'is-active' : ''}" type="button" aria-label="お知らせ ${index + 1}" data-index="${index}"></button>
    `).join('');

    document.querySelectorAll('.notice-dot').forEach((dot) => {
      dot.addEventListener('click', () => {
        noticeIndex = Number(dot.dataset.index);
        renderNoticeSlides();
      });
    });
  }

  function nextNotice() {
    noticeIndex = (noticeIndex + 1) % noticeItems.length;
    renderNoticeSlides();
  }

  renderNoticeSlides();
  setInterval(nextNotice, 5000);
</script>
<script src="static/text-size.js"></script>

</body>
</html>
