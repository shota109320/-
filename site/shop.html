<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みうらや誠麺 お店の情報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Yuji+Boku&display=swap" rel="stylesheet">
<style>
  :root {
    --wood-dark: #332116;
    --wood-mid: #624027;
    --wood-light: #9b693f;
    --paper: #f7f0df;
    --paper-deep: #e8d6ac;
    --red: #a8322a;
    --red-dark: #76231d;
    --ink: #2a1c14;
    --muted: #624b38;
    --shadow: rgba(24, 13, 8, 0.25);
  }

  * { box-sizing: border-box; }

  html { background: #160d08; }

  body {
    margin: 0;
    min-width: 0;
    overflow-x: hidden;
    color: var(--ink);
    font-family: "Noto Sans JP", sans-serif;
    background:
      linear-gradient(rgba(25, 13, 7, 0.5), rgba(25, 13, 7, 0.5)),
      repeating-linear-gradient(90deg, #4d2d1a 0 20px, #5e3821 20px 38px, #432515 38px 54px);
  }

  a { color: inherit; text-decoration: none; }

  .page {
    width: min(100%, 980px);
    min-height: 100vh;
    margin: 0 auto;
    background:
      linear-gradient(rgba(255,255,255,0.08), rgba(255,255,255,0.08)),
      repeating-linear-gradient(0deg, #f6efdf 0 3px, #f1e8d4 3px 7px);
    box-shadow: 0 0 45px rgba(0,0,0,0.55);
  }

  .topbar {
    padding: 28px 22px 24px;
    text-align: center;
    background:
      linear-gradient(rgba(45, 27, 17, 0.12), rgba(45, 27, 17, 0.12)),
      repeating-linear-gradient(0deg, #3d281b 0 12px, #493020 12px 20px);
    border-bottom: 5px solid var(--red-dark);
  }

  .brand {
    margin: 0;
    color: #f3e5bf;
    font-family: "Yuji Boku", "Shippori Mincho", serif;
    font-size: clamp(2.3rem, 6vw, 4.4rem);
    font-weight: 400;
    letter-spacing: 0.12em;
    text-shadow: 2px 3px 0 #160d08;
  }

  .title {
    margin: 10px 0 0;
    color: #fff7df;
    font-family: "Shippori Mincho", serif;
    font-size: clamp(1.5rem, 3vw, 2.3rem);
    letter-spacing: 0.16em;
  }

  main { padding: 30px 24px 56px; }

  .section {
    max-width: 900px;
    margin: 0 auto 30px;
    border: 5px solid var(--wood-dark);
    background: rgba(247, 240, 223, 0.92);
    box-shadow: 0 10px 24px var(--shadow), inset 0 0 0 2px #b89568;
  }

  .section-heading {
    margin: 0;
    padding: 14px 20px 12px;
    color: #fff1cd;
    background: linear-gradient(180deg, #b44235, var(--red-dark));
    border-bottom: 3px solid var(--wood-dark);
    font-family: "Shippori Mincho", serif;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    letter-spacing: 0.1em;
  }

  .store-photo-wrap { padding: 22px; }

  .store-photo {
    width: 100%;
    height: auto;
    border: 9px solid var(--wood-mid);
    outline: 2px solid var(--wood-light);
    box-shadow: 0 10px 20px var(--shadow);
  }

  .intro {
    padding: 0 22px 24px;
  }

  .intro h3 {
    margin: 0 0 10px;
    color: var(--red-dark);
    font-family: "Shippori Mincho", serif;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
  }

  .intro p {
    margin: 0;
    line-height: 1.9;
    color: var(--muted);
  }

  .info-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    gap: 14px;
    padding: 22px;
  }

  .info-item {
    padding: 15px 16px;
    background: linear-gradient(90deg, var(--paper-deep), var(--paper));
    border-left: 7px solid var(--wood-mid);
  }

  .info-item.hours-card {
    border-left-color: var(--red);
  }

  .label {
    display: block;
    margin-bottom: 8px;
    color: var(--red-dark);
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  .value {
    line-height: 1.85;
    font-weight: 500;
  }

  .hours {
    display: grid;
    grid-template-columns: 6em minmax(0, 1fr);
    gap: 5px 8px;
    align-items: baseline;
    font-size: 1.08rem;
    white-space: nowrap;
  }

  .hours span:nth-child(odd) { color: var(--red-dark); font-weight: 700; }
  .unconfirmed { color: var(--muted); }

  .actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
    max-width: 900px;
    margin: 0 auto;
  }

  .button {
    display: inline-flex;
    min-width: 220px;
    min-height: 54px;
    align-items: center;
    justify-content: center;
    padding: 13px 20px;
    color: #fff3d1;
    background: linear-gradient(180deg, #ae3c31, #76231d);
    border: 3px solid #4b2118;
    box-shadow: 0 6px 12px var(--shadow);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-align: center;
  }

  .button.brown { background: linear-gradient(180deg, #815633, #54331f); }
  .button.black { background: linear-gradient(180deg, #443126, #211711); }

  @media (max-width: 700px) {
    main { padding: 22px 14px 42px; }
    .info-grid { grid-template-columns: 1fr; padding: 16px; }
    .store-photo-wrap { padding: 16px; }
    .intro { padding: 0 16px 18px; }
  }

  @media (max-width: 420px) {
    .topbar { padding-left: 14px; padding-right: 14px; }
    .section-heading { padding-left: 14px; padding-right: 14px; }
    .hours {
      grid-template-columns: 5.2em minmax(0, 1fr);
      white-space: normal;
      font-size: 0.98rem;
    }
    .actions { flex-direction: column; }
    .button { width: 100%; min-width: 0; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <h1 class="brand">みうらや誠麺</h1>
      <p class="title">お店の情報</p>
    </header>

    <main>
      <section class="section">
        <h2 class="section-heading">店舗写真</h2>
        <div class="store-photo-wrap">
          <img class="store-photo" src="static/images/store.jpg" alt="みうらや誠麺の店舗写真">
        </div>
        <div class="intro">
          <h3>みうらや誠麺について</h3>
          <!-- TODO: 店舗紹介文を店長に確認 -->
          <p>店舗紹介文は確認中です。</p>
        </div>
      </section>

      <section class="section">
        <h2 class="section-heading">店舗情報</h2>
        <div class="info-grid">
          <div class="info-item">
            <span class="label">店舗名</span>
            <div class="value">みうらや誠麺</div>
          </div>
          <div class="info-item">
            <span class="label">住所</span>
            <div class="value">〒297-0074<br>千葉県茂原市小林1978-57</div>
          </div>
          <div class="info-item hours-card">
            <span class="label">営業時間</span>
            <div class="value hours">
              <span>平日</span><span>11:00〜14:30</span>
              <span>休日・祝日</span><span>11:00〜14:30 / 17:00〜21:00</span>
            </div>
          </div>
          <div class="info-item">
            <span class="label">定休日</span>
            <div class="value unconfirmed">なし</div>
          </div>
          <div class="info-item">
            <span class="label">電話番号</span>
            <div class="value unconfirmed">0475-36-7036</div>
          </div>
          <div class="info-item">
            <span class="label">席数</span>
            <div class="value unconfirmed">22</div>
          </div>
          <div class="info-item">
            <span class="label">駐車場</span>
            <div class="value unconfirmed">2台</div>
          </div>
          <div class="info-item">
            <span class="label">支払い方法</span>
            <div class="value unconfirmed">確認中</div>
          </div>
          <div class="info-item">
            <span class="label">予約の可否</span>
            <div class="value unconfirmed">予約可</div>
          </div>
        </div>
      </section>

      <nav class="actions" aria-label="店舗情報の関連ページ">
        <a class="button" href="access.html">アクセス・地図を見る</a>
        <a class="button brown" href="detail.html">お品書きを見る</a>
        <a class="button black" href="kodawari.html">麺へのこだわりを見る</a>
        <a class="button brown" href="index.html">トップページへ戻る</a>
      </nav>
    </main>
  </div>
</body>
</html>
