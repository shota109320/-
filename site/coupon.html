<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みうらや誠麺 会員クーポン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Yuji+Boku&display=swap" rel="stylesheet">
<style>
	:root {
		--wood-dark: #332116;
		--wood-mid: #624027;
		--wood-light: #9b693f;
		--paper: #f7f0df;
		--paper-deep: #e8d6ac;
		--red: #a8322a;
		--red-dark: #76231d;
		--ink: #2a1c14;
		--muted: #604b3b;
		--shadow: rgba(24, 13, 8, 0.25);
	}

	* { box-sizing: border-box; }
	html { background: #160d08; }

	body {
		margin: 0;
		min-width: 0;
		overflow-x: hidden;
		color: var(--ink);
		font-family: "Noto Sans JP", sans-serif;
		background:
			linear-gradient(rgba(25, 13, 7, 0.5), rgba(25, 13, 7, 0.5)),
			repeating-linear-gradient(90deg, #4d2d1a 0 20px, #5e3821 20px 38px, #432515 38px 54px);
	}

	a { color: inherit; text-decoration: none; }

	.page {
		width: min(100%, 980px);
		min-height: 100vh;
		margin: 0 auto;
		background:
			linear-gradient(rgba(255,255,255,0.08), rgba(255,255,255,0.08)),
			repeating-linear-gradient(0deg, #f6efdf 0 3px, #f1e8d4 3px 7px);
		box-shadow: 0 0 45px rgba(0,0,0,0.55);
	}

	.topbar {
		padding: 28px 22px 24px;
		text-align: center;
		background:
			linear-gradient(rgba(45, 27, 17, 0.12), rgba(45, 27, 17, 0.12)),
			repeating-linear-gradient(0deg, #3d281b 0 12px, #493020 12px 20px);
		border-bottom: 5px solid var(--red-dark);
	}

	.brand {
		margin: 0;
		color: #f3e5bf;
		font-family: "Yuji Boku", "Shippori Mincho", serif;
		font-size: clamp(2.3rem, 6vw, 4.4rem);
		font-weight: 400;
		letter-spacing: 0.12em;
		text-shadow: 2px 3px 0 #160d08;
	}

	.title {
		margin: 10px 0 0;
		color: #fff7df;
		font-family: "Shippori Mincho", serif;
		font-size: clamp(1.5rem, 3vw, 2.3rem);
		letter-spacing: 0.16em;
	}

	main { padding: 38px 24px 60px; }

	.guest-content,
	.member-section {
		width: min(100%, 700px);
		margin: 0 auto 28px;
		border: 8px solid var(--wood-dark);
		background: rgba(247, 240, 223, 0.95);
		box-shadow: 0 12px 26px var(--shadow), inset 0 0 0 2px #b89568;
	}

	.section-heading {
		margin: 0;
		padding: 16px 20px 13px;
		color: #fff1cd;
		background: linear-gradient(180deg, #b44235, var(--red-dark));
		border-bottom: 3px solid var(--wood-dark);
		font-family: "Shippori Mincho", serif;
		font-size: clamp(1.35rem, 3vw, 1.8rem);
		letter-spacing: 0.1em;
		text-align: center;
	}

	.guest-body { padding: 30px 28px 32px; text-align: center; }

	.guest-body h3 {
		margin: 0;
		color: var(--red-dark);
		font-family: "Shippori Mincho", serif;
		font-size: clamp(1.5rem, 4vw, 2.2rem);
		letter-spacing: 0.08em;
	}

	.guest-body p {
		margin: 16px 0 0;
		color: var(--muted);
		line-height: 1.9;
	}

	.entry-button,
	.home-button,
	.use-button {
		display: flex;
		min-height: 56px;
		align-items: center;
		justify-content: center;
		padding: 14px 20px;
		color: #fff3d1;
		background: linear-gradient(180deg, #ae3c31, #76231d);
		border: 3px solid #4b2118;
		box-shadow: 0 6px 12px var(--shadow);
		font-weight: 700;
		letter-spacing: 0.08em;
		text-align: center;
	}

	.entry-button { margin-top: 25px; font-size: 1.1rem; }
	.signup-prompt { margin-top: 26px !important; }
	.entry-button.secondary,
	.home-button { background: linear-gradient(180deg, #815633, #54331f); }

	.coupon-body { padding: 22px; }

	.coupon-card {
		position: relative;
		padding: 22px 20px 20px;
		background: linear-gradient(135deg, #fff4d5, #e8d7aa);
		border: 3px dashed var(--red);
		box-shadow: inset 0 0 0 2px rgba(255,255,255,0.55), 0 7px 14px var(--shadow);
	}

	.coupon-card::before,
	.coupon-card::after {
		content: "";
		position: absolute;
		top: 50%;
		width: 20px;
		height: 20px;
		background: var(--paper);
		border: 3px solid var(--red);
		border-radius: 50%;
		transform: translateY(-50%);
	}

	.coupon-card::before { left: -14px; }
	.coupon-card::after { right: -14px; }

	.coupon-label,
	.coupon-value,
	.coupon-field { display: block; }

	.coupon-label {
		color: var(--red-dark);
		font-size: 0.82rem;
		font-weight: 700;
		letter-spacing: 0.12em;
	}

	.coupon-value {
		margin-top: 6px;
		font-family: "Shippori Mincho", serif;
		font-size: 1.45rem;
		font-weight: 700;
	}

	.coupon-details {
		display: grid;
		gap: 7px;
		margin: 18px 0 0;
		padding-top: 15px;
		border-top: 1px solid rgba(118, 35, 29, 0.35);
	}

	.coupon-field {
		display: grid;
		grid-template-columns: 6em minmax(0, 1fr);
		gap: 10px;
		color: var(--muted);
		line-height: 1.7;
	}

	.coupon-field dt { font-weight: 700; }
	.coupon-field dd { margin: 0; }

	.use-button {
		width: 100%;
		margin-top: 20px;
		cursor: default;
	}

	.actions { width: min(100%, 700px); margin: 0 auto; }
	.home-button { width: min(100%, 260px); margin: 0 auto; }

	.coupon-list {
		width: min(100%, 700px);
		margin: 0 auto;
		display: grid;
		gap: 20px;
	}

	.coupon-card {
		padding: 22px 20px 20px;
		background: linear-gradient(135deg, #fff4d5, #e8d7aa);
		border: 3px dashed var(--red);
		box-shadow: inset 0 0 0 2px rgba(255,255,255,0.55), 0 7px 14px var(--shadow);
	}

	.coupon-card.is-used {
		background: linear-gradient(135deg, #e4dfd4, #cfc8bc);
		border-color: #756b60;
	}

	.coupon-name {
		margin: 0;
		color: var(--red-dark);
		font-family: "Shippori Mincho", serif;
		font-size: 1.45rem;
	}

	.coupon-description {
		margin: 12px 0 0;
		color: var(--ink);
		line-height: 1.8;
	}

	.coupon-use {
		width: 100%;
		min-height: 58px;
		margin-top: 18px;
		padding: 14px 20px;
		color: #fff3d1;
		background: linear-gradient(180deg, #ae3c31, #76231d);
		border: 3px solid #4b2118;
		box-shadow: 0 6px 12px var(--shadow);
		font: inherit;
		font-size: 1.05rem;
		font-weight: 700;
		letter-spacing: 0.08em;
		cursor: pointer;
	}

	.coupon-used {
		display: block;
		margin-top: 18px;
		padding: 12px;
		color: #3f3933;
		border: 3px solid #756b60;
		font-size: 1.2rem;
		font-weight: 700;
		letter-spacing: 0.12em;
		text-align: center;
	}

	.coupon-confirm[hidden] { display: none; }

	.coupon-confirm {
		position: fixed;
		inset: 0;
		z-index: 70;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 20px;
		background: rgba(22,13,8,0.62);
	}

	.coupon-confirm-box {
		width: min(100%, 420px);
		padding: 24px 20px 20px;
		background: var(--paper);
		border: 5px solid var(--wood-dark);
		box-shadow: 0 12px 28px rgba(0,0,0,0.35);
		text-align: center;
	}

	.coupon-confirm-box p {
		margin: 0;
		color: var(--ink);
		font-size: 1.1rem;
		font-weight: 700;
		line-height: 1.7;
	}

	.coupon-confirm-actions {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 12px;
		margin-top: 20px;
	}

	.coupon-confirm-actions button {
		min-height: 52px;
		padding: 12px 10px;
		border: 3px solid var(--wood-dark);
		font: inherit;
		font-weight: 700;
		cursor: pointer;
	}

	.coupon-cancel { color: var(--ink); background: #e8d6ac; }
	.coupon-approve { color: #fff3d1; background: linear-gradient(180deg, #ae3c31, #76231d); }

	.back-bar {
		position: fixed;
		right: 20px;
		bottom: 20px;
		z-index: 40;
		padding: 0;
		text-align: center;
	}

	.back-link {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		background: linear-gradient(180deg, #783e2e, #5d271f);
		color: #fbecc8;
		font-weight: 700;
		letter-spacing: 0.08em;
		border-radius: 999px;
		padding: 14px 24px;
		box-shadow: 0 10px 20px rgba(35, 18, 13, 0.18);
		border: 2px solid rgba(255,255,255,0.18);
	}

	@media (max-width: 600px) {
		main { padding: 24px 14px 42px; }
		.coupon-list { gap: 16px; }
		.coupon-card { padding: 20px 16px 18px; }
	}

	@media (max-width: 390px) {
		.topbar { padding-left: 14px; padding-right: 14px; }
		.section-heading { padding-left: 12px; padding-right: 12px; }
		.coupon-field { grid-template-columns: 5.3em minmax(0, 1fr); }
		.home-button { width: 100%; }
		.coupon-confirm-actions { grid-template-columns: 1fr; }
	}

	@media (max-width: 768px) {
		.back-bar { right: 12px; bottom: 12px; }
		.back-link { padding: 12px 16px; font-size: 0.86rem; }
	}

	@media (min-width: 769px) {
		.page { max-width: 740px; }
	}
</style>
<link rel="stylesheet" href="static/text-size.css">
</head>
<body>
	<button class="text-size-toggle" type="button" aria-pressed="false">文字を大きく</button>
	<div class="page">
		<header class="topbar">
			<h1 class="brand">みうらや誠麺</h1>
			<p class="title">会員クーポン</p>
		</header>

		<main>
				<section class="member-section" aria-labelledby="coupon-heading">
					<h2 class="section-heading" id="coupon-heading">クーポン</h2>
					<div class="coupon-body">
						<div class="coupon-list">
							<article class="coupon-card" data-coupon-id="discount-100">
								<h3 class="coupon-name">100円引きクーポン</h3>
								<p class="coupon-description">お会計時にご利用いただけます。<br>詳細は店頭でご確認ください。</p>
								<button class="coupon-use" type="button">使用する</button>
							</article>

							<article class="coupon-card" data-coupon-id="topping-free">
								<h3 class="coupon-name">トッピング無料クーポン</h3>
								<p class="coupon-description">対象のトッピングにご利用いただけます。<br>詳細は店頭でご確認ください。</p>
								<button class="coupon-use" type="button">使用する</button>
							</article>

							<article class="coupon-card" data-coupon-id="gyouza">
								<h3 class="coupon-name">餃子クーポン</h3>
								<p class="coupon-description">餃子にご利用いただけます。<br>詳細は店頭でご確認ください。</p>
								<button class="coupon-use" type="button">使用する</button>
							</article>
						</div>
					</div>
				</section>

			<div class="actions">
				<a class="home-button" href="rank.html">会員ランクを確認する</a>
			</div>
		</main>
	</div>
	<div class="back-bar">
		<a class="back-link" href="index.html">トップページへ戻る</a>
	</div>

	<div class="coupon-confirm" id="coupon-confirm" hidden>
		<div class="coupon-confirm-box" role="dialog" aria-modal="true" aria-labelledby="coupon-confirm-message">
			<p id="coupon-confirm-message">このクーポンを使用しますか？</p>
			<div class="coupon-confirm-actions">
				<button class="coupon-cancel" id="coupon-cancel" type="button">キャンセル</button>
				<button class="coupon-approve" id="coupon-approve" type="button">使用する</button>
			</div>
		</div>
	</div>

		<script>
			// DEMO ONLY: Firebase接続後にlocalStorage処理を置き換える
			const couponStorageKey = 'miuraya-used-coupons';
			const couponConfirm = document.getElementById('coupon-confirm');
			const couponCancel = document.getElementById('coupon-cancel');
			const couponApprove = document.getElementById('coupon-approve');
			let selectedCoupon = null;
			let usedCoupons = new Set(JSON.parse(localStorage.getItem(couponStorageKey) || '[]'));

			function updateCouponCard(card) {
				const isUsed = usedCoupons.has(card.dataset.couponId);
				card.classList.toggle('is-used', isUsed);
				const useButton = card.querySelector('.coupon-use');
				let usedLabel = card.querySelector('.coupon-used');
				if (isUsed) {
					useButton.hidden = true;
					if (!usedLabel) {
						usedLabel = document.createElement('strong');
						usedLabel.className = 'coupon-used';
						usedLabel.textContent = '使用済み';
						card.appendChild(usedLabel);
					}
				} else {
					useButton.hidden = false;
					usedLabel?.remove();
				}
			}

			document.querySelectorAll('.coupon-card').forEach(updateCouponCard);

			document.querySelectorAll('.coupon-use').forEach(button => {
				button.addEventListener('click', () => {
					selectedCoupon = button.closest('.coupon-card');
					couponConfirm.hidden = false;
					couponCancel.focus();
				});
			});

			couponCancel.addEventListener('click', () => {
				couponConfirm.hidden = true;
				selectedCoupon?.querySelector('.coupon-use').focus();
			});

			couponApprove.addEventListener('click', () => {
				if (!selectedCoupon) return;
				usedCoupons.add(selectedCoupon.dataset.couponId);
				localStorage.setItem(couponStorageKey, JSON.stringify([...usedCoupons]));
				updateCouponCard(selectedCoupon);
				couponConfirm.hidden = true;
				selectedCoupon = null;
			});

			couponConfirm.addEventListener('click', event => {
				if (event.target === couponConfirm) couponCancel.click();
			});
		</script>
		<script src="static/text-size.js"></script>
</body>
</html>
